name: Vercel 프로덕션 배포

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 프론트엔드 빌드
        run: npm install && npm run build
        working-directory: frontend

      - name: Vercel CLI 설치
        run: npm install -g vercel@latest

      - name: 빌드 결과물 직접 배포
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes frontend/dist
        env:
          VERCEL_ORG_ID: team_tCe05zvlYk9cxzHfXWWIrD6P
          VERCEL_PROJECT_ID: prj_zKDCz6RPQwbTVbyA7l3YEIvO5iGe
