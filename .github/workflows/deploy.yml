name: Vercel 프로덕션 배포

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 프론트엔드 빌드
        run: npm install && npm run build
        working-directory: frontend

      - name: Vercel 프로젝트 연결 및 SPA 라우팅 설정
        run: |
          mkdir -p frontend/dist/.vercel
          echo '{"projectId":"prj_cK7iTnVw0BaCOrPmNEtCax1tdPVt","orgId":"team_tCe05zvlYk9cxzHfXWWIrD6P"}' > frontend/dist/.vercel/project.json
          cp frontend/vercel.json frontend/dist/vercel.json

      - name: Vercel CLI 설치
        run: npm install -g vercel@latest

      - name: Vercel 프로덕션 배포
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --scope younggonnim-9194s-projects
        working-directory: frontend/dist
