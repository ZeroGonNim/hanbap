name: Vercel 프로덕션 배포

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_tCe05zvlYk9cxzHfXWWIrD6P
      VERCEL_PROJECT_ID: prj_zKDCz6RPQwbTVbyA7l3YEIvO5iGe

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vercel CLI 설치
        run: npm install -g vercel@latest

      - name: Vercel 프로덕션 배포
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
