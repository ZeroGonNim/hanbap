name: 한마음식당 일일 마케팅 파이프라인

on:
  schedule:
    # 매일 오전 9시 KST 실행 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 허용

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 루트 의존성 설치
        run: npm install

      - name: Playwright 브라우저 설치
        run: npx playwright install chromium --with-deps

      - name: 파이프라인 실행 (리뷰 수집 → Gemini 분석 → 피드 업데이트)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start

      - name: 변경된 리뷰 피드 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/src/data/reviews.json frontend/public/stats.json reports/
          git diff --staged --quiet || git commit -m "chore: 일일 리뷰 피드 및 통계 자동 업데이트 $(date +'%Y-%m-%d')"
          git push
