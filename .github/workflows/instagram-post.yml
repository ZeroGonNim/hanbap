name: 인스타그램 자동 포스팅

on:
  schedule:
    # 백업용 (daily-pipeline 체이닝 실패 시 대비)
    - cron: '0 2 * * *'
  workflow_dispatch: # 수동 실행 + daily-pipeline 체이닝 트리거

permissions:
  contents: write

concurrency:
  group: main-branch-push
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 인스타그램 토큰 유효성 검증
        env:
          ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::IG_ACCESS_TOKEN Secret이 비어있습니다."
            echo "TOKEN_VALID=false" >> $GITHUB_ENV
            exit 1
          fi
          RESPONSE=$(curl -s -G "https://graph.facebook.com/v25.0/me" --data-urlencode "fields=id,name" --data-urlencode "access_token=${ACCESS_TOKEN}")
          echo "API Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "::error::Instagram 토큰이 만료되었거나 유효하지 않습니다."
            echo "TOKEN_VALID=false" >> $GITHUB_ENV
            exit 1
          fi
          echo "TOKEN_VALID=true" >> $GITHUB_ENV
          echo "✅ 토큰 검증 성공"

      - name: 루트 의존성 설치
        run: npm install

      - name: 인스타그램 포스팅 실행
        id: posting
        run: node scripts/instagram_automation/integrated_auto_promo.js
        env:
          ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          PRODUCTION_URL: https://hanbap.vercel.app
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 변경사항 커밋 (today_promo 업데이트)
        id: git-sync
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add --ignore-errors frontend/public/data/ frontend/public/images/ai-generated/ scripts/instagram_automation/scheduled_posts.json 2>/dev/null || true
          git diff --staged --quiet && echo "변경사항 없음, 커밋 스킵" && exit 0
          git commit -m "chore: 인스타그램 포스팅 및 today_promo 업데이트 $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push

      - name: 실패 시 텔레그램 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN_VALID: ${{ env.TOKEN_VALID }}
          POSTING_RESULT: ${{ steps.posting.outcome }}
          GIT_SYNC_RESULT: ${{ steps.git-sync.outcome }}
        run: |
          if [ "$TOKEN_VALID" = "false" ]; then
            MSG="🔑 [인스타그램] 토큰이 만료되었습니다! GitHub Secrets(IG_ACCESS_TOKEN)을 갱신해주세요."
          elif [ "$POSTING_RESULT" = "failure" ]; then
            MSG="❌ [인스타 포스팅 실패] 인스타그램 게시에 실패했습니다."
          elif [ "$GIT_SYNC_RESULT" = "failure" ]; then
            MSG="⚠️ [Git 동기화 실패] 인스타 포스팅은 성공했으나, 변경사항 커밋/푸시에 실패했습니다. 인스타는 정상 게시되었으니 참고해주세요."
          else
            MSG="❌ [인스타그램 워크플로우 실패] 알 수 없는 단계에서 실패했습니다."
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"${MSG}\n확인: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
